# Proxy backend calls through the Netlify origin so the session cookie is
# first-party (fixes Safari/strict-Chrome third-party-cookie blocking).
# The app calls /bk/... (same-origin); Netlify forwards to the Render backend.
# app.js is prebuilt and committed, so Netlify only needs to publish the files —
# no build step (keeps deploys within the free-tier build-minute limit).
# IMPORTANT: run `npm run build` locally and commit app.js before pushing UI
# changes, or the deploy will serve a stale bundle.
[build]
  publish = "."

[[redirects]]
  from = "/bk/*"
  to = "https://muddy-york.onrender.com/:splat"
  status = 200
  force = true

# The blog is rendered by the backend (posts are written in the admin
# dashboard) and served on the main domain so search engines credit this site.
[[redirects]]
  from = "/blog"
  to = "https://muddy-york.onrender.com/blog/"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://muddy-york.onrender.com/blog/:splat"
  status = 200
  force = true

# Zone regulation pages, rendered by the backend from the official summary it
# syncs twice a day.
[[redirects]]
  from = "/regulations"
  to = "https://muddy-york.onrender.com/regulations/"
  status = 200
  force = true

[[redirects]]
  from = "/regulations/*"
  to = "https://muddy-york.onrender.com/regulations/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/blog-sitemap.xml"
  to = "https://muddy-york.onrender.com/blog-sitemap.xml"
  status = 200
  force = true

# publish="." serves the whole repo. Deny direct access to source/dev paths so
# only the app + SEO pages are reachable. Runtime assets (app.js, /vendor,
# /assets, /icons, sw.js, manifest) are intentionally NOT blocked.
[[redirects]]
  from = "/backend/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/marketing/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/server/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/lib/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/source-app.jsx"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/build.mjs"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/vitest.config.js"
  to = "/404"
  status = 404
  force = true
