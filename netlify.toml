# Proxy backend calls through the Netlify origin so the session cookie is
# first-party (fixes Safari/strict-Chrome third-party-cookie blocking).
# The app calls /bk/... (same-origin); Netlify forwards to the Render backend.
# app.js is prebuilt and committed, so Netlify only needs to publish the files —
# no build step (keeps deploys within the free-tier build-minute limit).
# IMPORTANT: run `npm run build` locally and commit app.js before pushing UI
# changes, or the deploy will serve a stale bundle.
[build]
  publish = "."

[[redirects]]
  from = "/bk/*"
  to = "https://muddy-york.onrender.com/:splat"
  status = 200
  force = true

# The blog is rendered by the backend (posts are written in the admin
# dashboard) and served on the main domain so search engines credit this site.
[[redirects]]
  from = "/blog"
  to = "https://muddy-york.onrender.com/blog/"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://muddy-york.onrender.com/blog/:splat"
  status = 200
  force = true

# Zone regulation pages, rendered by the backend from the official summary it
# syncs twice a day.
[[redirects]]
  from = "/regulations"
  to = "https://muddy-york.onrender.com/regulations/"
  status = 200
  force = true

[[redirects]]
  from = "/regulations/*"
  to = "https://muddy-york.onrender.com/regulations/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/regs-sitemap.xml"
  to = "https://muddy-york.onrender.com/regs-sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/blog-sitemap.xml"
  to = "https://muddy-york.onrender.com/blog-sitemap.xml"
  status = 200
  force = true

# publish="." serves the whole repo. Deny direct access to source/dev paths so
# only the app + SEO pages are reachable. Runtime assets (app.js, /vendor,
# /assets, /icons, sw.js, manifest) are intentionally NOT blocked.
[[redirects]]
  from = "/backend/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/marketing/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/server/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/lib/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/source-app.jsx"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/build.mjs"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/vitest.config.js"
  to = "/404"
  status = 404
  force = true

# Security headers for every page. The Content Security Policy is report-only
# for now: it blocks nothing, and browsers report what it would have blocked to
# /bk/api/csp-report (Admin › Integrations). Enforce it once the reports are clean.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://js.stripe.com https://accounts.google.com https://appleid.cdn-apple.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://api.open-meteo.com https://overpass-api.de https://overpass.kumi.systems https://router.project-osrm.org https://api.stripe.com https://api.cloudinary.com https://res.cloudinary.com https://server.arcgisonline.com https://muddy-york.onrender.com; frame-src https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://www.googletagmanager.com; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self' https://accounts.google.com https://appleid.apple.com; frame-ancestors 'self'; report-uri /bk/api/csp-report"
