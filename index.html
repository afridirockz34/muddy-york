  <style>

    .boot{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#2C4C3B;
      color:#EFE9DB;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:16px;padding:24px;text-align:center;}
